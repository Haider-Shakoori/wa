services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-relaywa}
      POSTGRES_USER: ${POSTGRES_USER:-relaywa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - relaywa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-relaywa} -d ${POSTGRES_DB:-relaywa}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [relaywa_internal]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server','--appendonly','yes']
    volumes:
      - relaywa_redis:/data
    healthcheck:
      test: ['CMD','redis-cli','ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [relaywa_internal]

networks:
  relaywa_internal:
    driver: bridge

volumes:
  relaywa_postgres:
  relaywa_redis:
