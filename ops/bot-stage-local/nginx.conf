server {
  listen 8080;
  server_name _;
  client_max_body_size 2m;
  location /api/ {
    proxy_pass http://relaywa-bot-stage-api-20261120:3157;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header X-Real-IP $remote_addr;
  }
  location / {
    proxy_pass http://relaywa-bot-stage-web-20261120:3158;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto http;
  }
}
