# Isolated VPS billing candidate. Do not replace live API until routing and Stripe checks pass.
# Supply all secrets at deployment time; never commit their values.
services:
  api:
    image: ${RELAYWA_API_IMAGE:?Set reviewed immutable API image}
    restart: unless-stopped
    init: true
    working_dir: /app/apps/api
    command: ["node", "dist/main.js"]
    ports:
      - "127.0.0.1:${RELAYWA_API_HOST_PORT:-39092}:${RELAYWA_API_PORT:-39092}"
    networks:
      - billing_private
    environment:
      NODE_ENV: production
      API_PORT: "${RELAYWA_API_PORT:-39092}"
      DATABASE_URL: ${RELAYWA_DATABASE_URL:?Set candidate PostgreSQL connection}
      REDIS_URL: ${RELAYWA_REDIS_URL:?Set reviewed Redis connection}
      JWT_SECRET: ${RELAYWA_JWT_SECRET:?Use existing JWT secret}
      WEBHOOK_ENCRYPTION_KEY: ${RELAYWA_WEBHOOK_ENCRYPTION_KEY:?Use existing webhook encryption key}
      RELAYWA_ADMIN_EMAIL: ${RELAYWA_ADMIN_EMAIL:?Set existing admin email}
      RELAYWA_ADMIN_PASSWORD: ${RELAYWA_ADMIN_PASSWORD:?Set existing admin password}
      RELAYWA_BILLING_FORWARD_SECRET: ${RELAYWA_BILLING_FORWARD_SECRET:?Set shared billing HMAC secret of at least 32 characters}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+process.env.API_PORT+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 30s
# The API is bound to loopback only; do not expose it via public proxy until cutover gates pass.
networks:
  billing_private:
    external: true
    name: ${RELAYWA_INTERNAL_NETWORK:?Set reviewed private Docker network}
