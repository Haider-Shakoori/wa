name: Publish RelayWA Cookie Message on Cloudflare
on:
  push:
    branches: [feat/relaywa-cloudflare-cookie-message]
    paths:
      - .github/workflows/relaywa-cookie-message-publish.yml
permissions:
  contents: read
concurrency:
  group: relaywa-seo-production-routes
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies and validate Next application
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @wa/web build
      - name: Build and validate self-contained SEO Worker and cookie message
        shell: bash
        run: |
          pnpm --filter @wa/web exec next start -p 3000 > /tmp/relaywa-cookie-prod-build.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node --check ops/seo-overlay/cookie-message.js
          node ops/seo-overlay/build.mjs
          node --check ops/seo-overlay/dist/index.mjs
          node --test ops/seo-overlay/test.mjs
      - name: Verify Cloudflare ownership and no conflicting public Worker routes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 ops/seo-overlay/routes.py check
      - name: Verify separated staging Worker before modifying production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEO_PREVIEW_WORKER: relaywa-cookie-staging
        run: python3 ops/seo-overlay/smoke.py preview
      - name: Install isolated Chromium test browser
        working-directory: tests/seo-e2e
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Deploy only existing SEO overlay Worker; preserve app API DB bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config ops/seo-overlay/wrangler.toml
      - name: Verify the new SEO Worker version after edge propagation before routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 ops/seo-overlay/smoke.py preview
      - name: Publish only exact marketing/cookie routes with automatic rollback
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          python3 ops/seo-overlay/routes.py apply
          READY=0
          for i in $(seq 1 8); do
            if python3 ops/seo-overlay/smoke.py live && python3 ops/seo-overlay/routes.py verify; then
              READY=1
              break
            fi
            echo "Cloudflare edge propagation or a public-page test is incomplete ($i/8)"
            sleep 5
          done
          if [ "$READY" = 1 ]; then
            echo "Public HTTP and routing checks passed; testing real desktop/mobile browsers."
            if (cd tests/seo-e2e && SEO_E2E_ORIGIN=https://relaywa.com npx playwright test --config=playwright.config.cjs --grep @cookie); then
              echo "SUCCESS: live cookie notice, eight origin pages, three SEO pages and sitemap validated."
              exit 0
            fi
          fi
          echo "PRODUCTION CHECK FAILED: Removing only NEW exact Worker routes created this run."
          python3 ops/seo-overlay/routes.py rollback || true
          exit 1
