name: npm SDK OIDC staged publication (manual only)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact new SDK version in package.json (e.g. 0.1.2)'
        required: true
        type: string
      confirmation:
        description: 'Enter STAGE_RELAYWA_SDK to authorize npm staging only (not public approval)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage-sdk:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'STAGE_RELAYWA_SDK' }}
    runs-on: ubuntu-latest
    environment: sdk-npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm with staging and OIDC support
        run: npm install --global npm@11.21.1
      - name: Verify package identity, exact version and public access
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node -e "const p=require('./packages/sdk-typescript/package.json'); const v=process.env.EXPECTED_VERSION; if(!/^[0-9]+\.[0-9]+\.[0-9]+$/.test(v)||p.name!=='@relaywa/sdk'||p.version!==v||p.private!==false||p.publishConfig?.access!=='public') process.exit(1)"
          node -e "const p=require('./packages/sdk-typescript/package-lock.json'); if(p.version!==process.env.EXPECTED_VERSION || p.packages?.['']?.version!==process.env.EXPECTED_VERSION)process.exit(1)"
      - name: Reject versions already published to npm
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if npm view "@relaywa/sdk@${EXPECTED_VERSION}" version --json --prefer-online > /dev/null 2>&1; then
            echo "::error::This version is already publicly published; bump SDK version in a reviewed PR."
            exit 1
          fi
      - name: Build and test SDK in isolation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/relaywa-sdk-stage
          cp -a packages/sdk-typescript/. /tmp/relaywa-sdk-stage/
          cd /tmp/relaywa-sdk-stage
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          cp -a dist "$GITHUB_WORKSPACE/packages/sdk-typescript/dist"
          cd "$GITHUB_WORKSPACE/packages/sdk-typescript"
          node --test test/*.test.mjs
          cd /tmp/relaywa-sdk-stage
          npm pack --dry-run
      - name: Stage npm package using GitHub OIDC (approval remains manual)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          cd /tmp/relaywa-sdk-stage
          npm stage publish --access public
