name: SDK package dry run
on:
  pull_request:
    paths:
      - 'packages/sdk-typescript/**'
      - 'sdks/**'
      - '.github/workflows/sdk-package-dryrun.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - name: Resolve SDK dependencies for lockfile diagnostic
        run: pnpm install --frozen-lockfile
      - name: Report lockfile drift without failing packaging
        id: lockfile_drift
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "Lockfile matches current dependency resolution."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "::warning::pnpm-lock.yaml changes under the declared package manager. Review the diagnostic artifact before restoring --frozen-lockfile."
            git diff --stat -- pnpm-lock.yaml
          fi
      - name: Upload resolved lockfile for review
        if: steps.lockfile_drift.outputs.drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sdk-resolved-pnpm-lockfile
          path: pnpm-lock.yaml
          retention-days: 7
      - run: pnpm --filter @relaywa/sdk build
      - name: Verify npm tarball without publishing
        working-directory: packages/sdk-typescript
        run: npm pack --dry-run --json > /tmp/relaywa-npm-pack.json && node -e "const p=require('/tmp/relaywa-npm-pack.json')[0]; if (!p.files.some(f=>f.path==='dist/index.js') || !p.files.some(f=>f.path==='dist/index.d.ts')) process.exit(1)"
      - name: Install npm tarball into clean consumer (offline API)
        run: |
          cd packages/sdk-typescript
          npm pack --pack-destination /tmp --silent
          mkdir -p /tmp/relaywa-node-consumer
          cd /tmp/relaywa-node-consumer
          npm init -y --silent
          npm install --ignore-scripts --no-audit --no-fund /tmp/relaywa-sdk-0.1.0.tgz
          node --input-type=module -e "import { RelayWA } from '@relaywa/sdk'; const sdk = new RelayWA({ sessionKey: 'offline-test' }); if (!sdk.sessions || !sdk.messages) process.exit(1); console.log('TypeScript package consumer import passed (offline)')"

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check build
      - run: python -m build sdks/python --outdir /tmp/relaywa-python-dist
      - run: python -c "import glob, zipfile; p=glob.glob('/tmp/relaywa-python-dist/*.whl'); assert len(p)==1; z=zipfile.ZipFile(p[0]); assert any(x.endswith('relaywa/__init__.py') for x in z.namelist())"
      - name: Install built wheel into clean consumer environment
        run: |
          python -m venv /tmp/relaywa-consumer
          /tmp/relaywa-consumer/bin/python -m pip install --no-deps /tmp/relaywa-python-dist/*.whl
          cd /tmp
          /tmp/relaywa-consumer/bin/python -c "from relaywa import RelayWA; sdk=RelayWA('offline-test'); assert sdk.base_url == 'https://relaywa.com/api'; print('Python wheel consumer import passed (offline)')"
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Composer metadata
        working-directory: sdks/php
        run: composer validate --no-check-publish --strict
      - run: php -l sdks/php/src/Client.php
      - name: Install Composer SDK into clean consumer (offline API)
        run: |
          mkdir -p /tmp/relaywa-php-consumer
          cd /tmp/relaywa-php-consumer
          composer init --no-interaction --name=relaywa/sdk-consumer --no-plugins
          composer config repositories.relaywa path "$GITHUB_WORKSPACE/sdks/php"
          composer require relaywa/sdk:@dev --no-interaction --no-scripts --no-plugins --no-progress
          php -r 'require "vendor/autoload.php"; $class = "RelayWA" . chr(92) . "Client"; $sdk = new $class("offline-test"); if (!($sdk instanceof $class)) exit(1); echo "Composer SDK consumer autoload passed (offline)\n";'

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet pack sdks/dotnet/RelayWA/RelayWA.csproj -c Release -o /tmp/relaywa-nuget
      - name: Verify NuGet archive
        run: python3 -c "import glob,zipfile; p=glob.glob('/tmp/relaywa-nuget/*.nupkg'); assert len(p)==1; z=zipfile.ZipFile(p[0]); assert any(x.endswith('RelayWA.dll') for x in z.namelist())"
      - name: Install NuGet package into clean consumer project (offline API)
        run: |
          mkdir -p /tmp/relaywa-dotnet-consumer
          cd /tmp/relaywa-dotnet-consumer
          dotnet new console --framework net8.0 --no-restore
          dotnet add package RelayWA.Sdk --version 0.1.0 --source /tmp/relaywa-nuget
          cat > Program.cs <<'EOF'
          using RelayWA;
          using System.Net.Http;
          using var http = new HttpClient();
          var sdk = new RelayWAClient(http, "offline-test");
          Console.WriteLine(sdk.GetType().FullName);
          EOF
          dotnet run --no-launch-profile

