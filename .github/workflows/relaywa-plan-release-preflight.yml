name: RelayWA Plan Release Preflight
on:
  push:
    branches: [fix/relaywa-cloudflare-plan-controls-20261014]
    paths: [.github/workflows/relaywa-plan-release-preflight.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify candidate Worker versions and D1 state (read-only)
        run: node ops/relaywa-cloudflare-plan-controls/preflight.mjs
