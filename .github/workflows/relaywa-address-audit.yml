name: RelayWA Public Address Read-Only Audit
on:
  push:
    branches: [audit/relaywa-public-address-20261014]
    paths: [.github/workflows/relaywa-address-audit.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect public Cloudflare website content for physical address values (read only)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const auth={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          const patterns=[
            ['old-placeholder',/123 Example Street|Springfield[, ]+IL[ ]+62701|Temporary address/gi],
            ['canada-postal',/\b[A-CEGHJ-NPR-TVXY]\d[A-CEGHJ-NPR-TV-Z][ -]?\d[A-CEGHJ-NPR-TV-Z]\d\b/gi],
            ['us-physical-address',/\b\d{2,5}\s+(?:[A-Za-z]+\s+){1,4}(?:Street|Avenue|Road|Boulevard|Drive|Lane|Place|Suite|St\.|Rd\.|Ave\.)\b/gi],
            ['postal-schema',/streetAddress|postalCode|addressLocality|addressRegion|addressCountry/gi],
            ['physical-address-heading',/physical address|mailing address|office address|our address|example address/gi],
            ['surrey-location',/\bSurrey\b|British Columbia|V3T[ -]?1J3/gi]
          ];
          const res=await fetch(root+'/workers/scripts/relaywa-web',{headers:auth,signal:AbortSignal.timeout(35000)});
          if(!res.ok)throw Error('Cannot inspect deployed relaywa-web Worker: '+res.status);
          const modules=await res.formData();
          console.log('WORKER_MODULE_COUNT '+[...modules.keys()].length);
          for(const [name,value] of modules.entries()){
            const source=typeof value==='string'?value:await value.text();
            const results=patterns.map(([label,reg])=>{
              const matches=[...source.matchAll(reg)];
              return [label,matches.length];
            }).filter(([,count])=>count>0);
            if(results.length)console.log('ADDRESS_PATTERN_MODULE '+JSON.stringify({name,matches:Object.fromEntries(results)}));
          }
          for(const p of ['/','/pricing','/help','/api-docs','/blog','/register']){
            const response=await fetch('https://relaywa.com'+p,{signal:AbortSignal.timeout(15000)});
            const html=await response.text();
            const found=patterns.filter(([label])=>label!=='postal-schema').map(([label,re])=>[label,[...html.matchAll(re)].length]).filter(([,count])=>count);
            console.log('PUBLIC_HTML '+p+' status='+response.status+' matches='+JSON.stringify(Object.fromEntries(found)));
          }
          console.log('READ_ONLY_SITE_ADDRESS_AUDIT_SUCCESS');
          NODE
