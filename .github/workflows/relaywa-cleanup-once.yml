name: RelayWA D1 One-Time Cleanup
on:
  push:
    branches:
      - maintenance/relaywa-d1-audit-20261014
    paths:
      - .github/workflows/relaywa-cleanup-once.yml
permissions:
  contents: read
concurrency:
  group: relaywa-d1-cleanup-once
  cancel-in-progress: false
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event.head_commit.message == 'Run approved RelayWA cleanup October 14'
    env:
      CLEANUP_MODE: execute
      CLEANUP_CONFIRM: CONFIRM_RELAYWA_D1_CLIENT_CLEANUP_20261014
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate maintenance procedure
        run: node --check scripts/relaywa-d1-one-time-client-cleanup.mjs
      - name: Run approved D1 cleanup and verify protected accounts
        run: node scripts/relaywa-d1-one-time-client-cleanup.mjs
