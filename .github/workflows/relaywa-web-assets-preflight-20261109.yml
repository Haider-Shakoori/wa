name: RelayWA web assets deployment preflight
on:
  push:
    branches: [main]
    paths: ['.github/workflows/relaywa-web-assets-preflight-20261109.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect current Worker version asset metadata read-only
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/'+process.env.CF_ACCOUNT+'/workers';
          const h={authorization:'Bearer '+process.env.CF_TOKEN};
          async function get(path){
            const r=await fetch(base+path,{headers:h,signal:AbortSignal.timeout(15000)});
            const raw=await r.text();let j;try{j=JSON.parse(raw)}catch{}
            console.log('ENDPOINT',path,'HTTP',r.status,'SUCCESS',j?.success??false);
            if(j?.result){
              const o=j.result;
              console.log('RESULT_FIELDS',Object.keys(o).join(','));
              if(o.bindings)console.log('BINDING_TYPES',JSON.stringify(o.bindings.map(b=>({type:b.type,name:b.name}))));
              if(o.assets)console.log('ASSET_FIELDS',Object.keys(o.assets).join(','));
              if(o.versions)console.log('VERSION_COUNT',o.versions.length);
              if(o.deployments)console.log('DEPLOYMENT_VERSIONS',JSON.stringify(o.deployments[0]?.versions));
            }
          }
          await get('/scripts/relaywa-web/settings');
          await get('/scripts/relaywa-web/deployments');
          await get('/scripts/relaywa-web/versions');
          await get('/scripts/relaywa-web/assets-upload-session');
          NODE