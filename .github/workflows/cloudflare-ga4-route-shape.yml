name: Cloudflare GA4 Route Shape (read only)

on:
  push:
    branches: [feat/ga4-cloudflare-credentials]
    paths:
      - .github/workflows/cloudflare-ga4-route-shape.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Extract redacted route shape, excluding all string literal values
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import os,re
          from urllib.request import Request,urlopen
          from urllib.parse import quote
          from email.parser import BytesParser
          from email.policy import default
          url='https://api.cloudflare.com/client/v4/accounts/'+quote(os.environ['CF_ACCOUNT'],safe='')+'/workers/scripts/relaywa-platform'
          with urlopen(Request(url,headers={'Authorization':'Bearer '+os.environ['CF_TOKEN']}),timeout=15) as r:
              ct=r.headers['Content-Type'];data=r.read(2_000_000)
          msg=BytesParser(policy=default).parsebytes(b'Content-Type: '+ct.encode()+b'\r\nMIME-Version: 1.0\r\n\r\n'+data)
          script=next((p.get_payload(decode=True).decode('utf8','replace') for p in msg.iter_parts() if p.get_filename()=='index.js'),'')
          offset=script.find('google-analytics')
          if offset<0:raise SystemExit('Route missing')
          s=script[max(0,offset-400):min(len(script),offset+1800)]
          # Remove every string/template literal; this is structure only, not source.
          out=[];i=0;mode=None;escaped=False
          while i<len(s):
              ch=s[i]
              if mode:
                  if escaped: escaped=False
                  elif ch=='\\':escaped=True
                  elif ch==mode:mode=None
                  i+=1
                  continue
              if ch in ('"', "'", '`'):
                  mode=ch;out.append('"[literal]"');i+=1;continue
              out.append(ch);i+=1
          structure=''.join(out)
          structure=re.sub(r'(?i)\b[a-f0-9]{24,}\b','[redacted]',structure)
          structure=re.sub(r'\b[A-Za-z0-9_+/=-]{90,}\b','[redacted]',structure)
          print('REDACTED ROUTE STRUCTURE BEGIN')
          print(structure[:2400])
          print('REDACTED ROUTE STRUCTURE END')
          PY
