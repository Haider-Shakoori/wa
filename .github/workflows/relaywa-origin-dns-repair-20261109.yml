name: RelayWA restore persistent VPS origin DNS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/relaywa-origin-dns-repair-20261109.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Ensure DNS-only VPS origin and verify
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN;
          if(!token)throw Error('Missing Cloudflare token');
          const headers={authorization:'Bearer '+token,'content-type':'application/json'};
          async function cf(path,method='GET',body){
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
            const j=await r.json();if(!r.ok||!j.success)throw Error(method+' '+path+' '+r.status+' '+JSON.stringify(j.errors||[]));return j.result;
          }
          const zone=(await cf('/zones?name=relaywa.com')).find(z=>z.name==='relaywa.com');
          if(!zone)throw Error('Zone not found');
          const base='/zones/'+zone.id+'/dns_records';
          const name='relaywa-vps-origin.relaywa.com';
          const existing=await cf(base+'?name='+name);
          if(existing.length){
            if(existing.length!==1||existing[0].type!=='A'||existing[0].content!=='108.165.233.125'||existing[0].proxied)throw Error('Conflicting origin DNS record');
            console.log('ORIGIN_DNS_ALREADY_CORRECT');
          }else{
            await cf(base,'POST',{type:'A',name,content:'108.165.233.125',proxied:false,ttl:300});
            console.log('ORIGIN_DNS_CREATED');
          }
          console.log('ORIGIN_DNS_PERSISTENT');
          NODE