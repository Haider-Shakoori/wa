name: Python SDK PyPI preflight (no publish)
on:
  pull_request:
    paths:
      - 'sdks/python/**'
      - '.github/workflows/python-sdk-preflight.yml'
      - '.github/workflows/python-sdk-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-python-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and metadata verification tools
        run: python -m pip install --upgrade build twine
      - name: Compile Python source without API calls
        run: python -m compileall -q sdks/python/relaywa
      - name: Build wheel and source distribution
        run: python -m build sdks/python --outdir /tmp/relaywa-python-dist
      - name: Check distribution metadata
        run: python -m twine check /tmp/relaywa-python-dist/*
      - name: Inspect built artifacts
        run: ls -lah /tmp/relaywa-python-dist
