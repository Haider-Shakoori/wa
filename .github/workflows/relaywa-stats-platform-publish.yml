name: Release RelayWA Platform Statistics Proxy
on:
  push:
    branches: [fix/relaywa-stats-platform-proxy]
    paths: [.github/workflows/relaywa-stats-platform-publish.yml]
permissions: {contents: read}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node ops/relaywa-platform-statistics/publish-proxy.mjs
