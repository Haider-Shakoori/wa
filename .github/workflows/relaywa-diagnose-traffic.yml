name: RelayWA Diagnose Current Traffic Asset
on:
  push:
    branches: [fix/admin-live-traffic-chunk]
    paths: [.github/workflows/relaywa-diagnose-traffic.yml, ops/relaywa-platform-statistics/diagnose-traffic.mjs]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node ops/relaywa-platform-statistics/diagnose-traffic.mjs
