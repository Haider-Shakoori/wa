name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Check production canary script
        run: node --check scripts/production-canary.mjs
      - name: Build
        run: pnpm build
      - name: Public SEO rendering and asset budget
        run: |
          pnpm --filter @wa/web exec next start -p 3000 > /tmp/relaywa-next.log 2>&1 &
          for i in $(seq 1 35); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node scripts/seo-perf-budget.mjs
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Validate production Docker Compose
        run: POSTGRES_PASSWORD=ci-secret docker compose -f docker-compose.production.yml config --quiet
      - name: Dependency audit
        run: pnpm audit --audit-level high
