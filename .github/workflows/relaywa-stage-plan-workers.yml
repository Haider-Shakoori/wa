name: RelayWA Stage Cloudflare Plan Workers
on:
  push:
    branches: [fix/relaywa-cloudflare-plan-controls-20261014]
    paths: [.github/workflows/relaywa-stage-plan-workers.yml]
permissions:
  contents: read
concurrency:
  group: relaywa-stage-website-plan-versions
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check staged surgical patch scripts
        run: |
          node --check ops/relaywa-cloudflare-plan-controls/patch.mjs
          node --check ops/relaywa-cloudflare-plan-controls/patch-web.mjs
          node --check ops/relaywa-cloudflare-plan-controls/stage.mjs
      - name: Upload Worker versions without deploying
        run: node ops/relaywa-cloudflare-plan-controls/stage.mjs

# Retry website staging with Cloudflare assets retention metadata.
