name: Publish RelayWA Session UI Refresh
on:
  push:
    branches: [feat/relaywa-sessions-ui-refresh]
    paths: [.github/workflows/relaywa-session-ui-publish.yml]
permissions: {contents: read}
concurrency: {group: relaywa-session-ui-refresh-release, cancel-in-progress: false}
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check ops/relaywa-platform-statistics/publish-ui-refresh.mjs
      - run: node ops/relaywa-platform-statistics/publish-ui-refresh.mjs
