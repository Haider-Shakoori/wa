name: SDK registry preflight (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registry-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check public package endpoints without publishing
        shell: bash
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          targets = [
              ('npm @relaywa/sdk', 'https://registry.npmjs.org/%40relaywa%2Fsdk'),
              ('PyPI relaywa-sdk', 'https://pypi.org/pypi/relaywa-sdk/json'),
              ('Packagist relaywa/sdk', 'https://repo.packagist.org/p2/relaywa/sdk.json'),
              ('NuGet RelayWA.Sdk', 'https://api.nuget.org/v3-flatcontainer/relaywa.sdk/index.json'),
          ]
          lines = ['# RelayWA SDK registry preflight', '', 'Read-only public endpoint check; **not** proof of name availability or account ownership.', '']
          for label, url in targets:
              req = urllib.request.Request(url, headers={'User-Agent':'RelayWA-SDK-preflight/0.1'})
              try:
                  with urllib.request.urlopen(req, timeout=15) as response:
                      status=response.status
              except urllib.error.HTTPError as e:
                  status=e.code
              except Exception as e:
                  status='ERROR (' + type(e).__name__ + ')'
              if status == 200:
                  interpretation='Public metadata exists; inspect for potential name conflict.'
              elif status == 404:
                  interpretation='No public metadata at this endpoint; availability and ownership remain unverified.'
              else:
                  interpretation='Inconclusive; verify manually.'
              lines.append(f'- **{label}**: HTTP {status} — {interpretation}')
          lines += ['', 'Before release: confirm npm @relaywa scope membership, PyPI project control, Packagist GitHub repository linkage, and NuGet package ownership. Use protected environments and explicit human approval. No packages were published.']
          report='\\n'.join(lines)+'\\n'
          print(report)
          open('sdk-registry-preflight.md','w').write(report)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-registry-preflight
          path: sdk-registry-preflight.md
          retention-days: 7
