name: RelayWA API migration Cloudflare route audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/relaywa-migration-cloudflare-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read Cloudflare route configuration (no mutations)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CF_TOKEN, account=process.env.CF_ACCOUNT;
          if(!token||!account) throw Error('Cloudflare GitHub secrets missing');
          const headers={Authorization:'Bearer '+token};
          async function get(path){
            const r=await fetch('https://api.cloudflare.com/client/v4'+path,{headers});
            if(!r.ok)throw Error(path+' HTTP '+r.status);
            const j=await r.json();
            if(!j.success)throw Error(path+' Cloudflare API failure');
            return j.result;
          }
          const zones=await get('/zones?name=relaywa.com');
          const zone=zones.find(z=>z.name==='relaywa.com');
          if(!zone)throw Error('relaywa.com zone not accessible');
          console.log('ZONE_FOUND',zone.name);
          for(const [label,path] of [
            ['WORKER_ROUTES','/zones/'+zone.id+'/workers/routes'],
            ['DNS_API','/zones/'+zone.id+'/dns_records?name=api.relaywa.com'],
            ['DNS_ROOT','/zones/'+zone.id+'/dns_records?name=relaywa.com']
          ]){
            try{
              const items=await get(path);
              console.log(label,JSON.stringify(items.map(x=>({
                pattern:x.pattern,script:x.script,type:x.type,name:x.name,
                proxied:x.proxied,content:x.type==='A'||x.type==='AAAA'?'[origin address redacted]':x.content
              }))));
            }catch(e){console.log(label+'_ERROR',String(e.message))}
          }
          try{
            const domains=await get('/accounts/'+account+'/workers/domains');
            console.log('WORKER_CUSTOM_DOMAINS',JSON.stringify(domains.filter(x=>x.hostname?.endsWith('relaywa.com')).map(x=>({hostname:x.hostname,service:x.service,environment:x.environment}))));
          }catch(e){console.log('CUSTOM_DOMAINS_ERROR',String(e.message))}
          NODE
