name: RelayWA SEO Worker isolated preflight
on:
  push:
    branches: [feat/cloudflare-seo-overlay-release]
    paths:
      - .github/workflows/relaywa-seo-overlay-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: relaywa-seo-overlay-preflight
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install source dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build original Next application
        run: pnpm --filter @wa/web build
      - name: Render SEO snapshots including Next 16 Turbopack CSS
        shell: bash
        run: |
          pnpm --filter @wa/web exec next start -p 3000 > /tmp/relaywa-seo-snapshot-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node ops/seo-overlay/build.mjs
          node --check ops/seo-overlay/dist/index.mjs
          node --test ops/seo-overlay/test.mjs
      - name: Check zone and route collisions without modifying the existing Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 ops/seo-overlay/routes.py check
      - name: Deploy ONLY isolated preview Worker, without a production domain route
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config ops/seo-overlay/wrangler.toml
      - name: Verify styled Workers.dev staging pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 ops/seo-overlay/smoke.py preview
