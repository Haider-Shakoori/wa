name: Publish RelayWA Administrator Session Renewal
on:
  push:
    branches: [fix/relaywa-platform-auth-renewal]
    paths: [.github/workflows/relaywa-session-renew-publish.yml]
permissions: {contents: read}
concurrency: {group: relaywa-platform-session-renewal-production, cancel-in-progress: false}
jobs:
  publish:
    if: github.event.head_commit.message == 'Publish guarded RelayWA administrator session renewal'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check ops/relaywa-auth-renewal/publish.mjs
      - run: node ops/relaywa-auth-renewal/publish.mjs
