name: Cloudflare Platform Worker Deployment Safety Audit

on:
  push:
    branches: [feat/ga4-cloudflare-credentials]
    paths:
      - .github/workflows/cloudflare-ga4-deploy-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect platform Worker multipart metadata, bindings and module inventory (GET only)
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.error import HTTPError
          from urllib.parse import quote
          from email.parser import BytesParser
          from email.policy import default
          import json,os
          account=quote(os.environ['CF_ACCOUNT'],safe='')
          base='https://api.cloudflare.com/client/v4/accounts/'+account+'/workers/'
          headers={'Authorization':'Bearer '+os.environ['CF_TOKEN'],'Accept':'*/*'}
          def get(endpoint):
              try:
                  with urlopen(Request(base+endpoint,headers=headers,method='GET'),timeout=15) as r:
                      return r.status,r.headers['Content-Type'],r.read(8_000_000)
              except HTTPError as e: return e.code,'',b''
          status,kind,data=get('scripts/relaywa-platform')
          print('Script read HTTP:',status)
          if status!=200: raise SystemExit(1)
          print('Script content type:',kind.split(';')[0], 'bytes:',len(data))
          msg=BytesParser(policy=default).parsebytes(b'Content-Type: '+kind.encode()+b'\r\nMIME-Version: 1.0\r\n\r\n'+data)
          for p in msg.iter_parts():
              name=p.get_param('name',header='content-disposition') or 'unknown'
              filename=p.get_filename()
              raw=p.get_payload(decode=True) or b''
              print('Part:',name,'filename:',filename,'type:',p.get_content_type(),'bytes:',len(raw))
              if name=='metadata':
                  try:
                      met=json.loads(raw)
                      print('Downloaded metadata keys:',list(met.keys()))
                      print('Downloaded metadata main_module:',met.get('main_module','not specified'))
                      print('Downloaded metadata binding names/types:',[(b.get('name'),b.get('type')) for b in met.get('bindings',[])])
                  except: print('Metadata is unavailable or non JSON')
          status,kind,data=get('scripts/relaywa-platform/settings')
          print('Script settings HTTP:',status)
          if status==200:
              raw=json.loads(data)
              settings=raw.get('result',{}) or {}
              print('Settings keys:',list(settings.keys()))
              print('Bindings name/type only:',[(b.get('name'),b.get('type')) for b in settings.get('bindings',[])])
              print('Placement keys:',list((settings.get('placement') or {}).keys()))
              print('Compatibility_date present:',bool(settings.get('compatibility_date')))
              print('Compatibility flags count:',len(settings.get('compatibility_flags') or []))
              print('Logs keys:',list((settings.get('observability') or {}).keys()))
          status,kind,data=get('scripts/relaywa-platform/secrets')
          print('Secrets metadata HTTP:',status)
          if status==200:
              raw=json.loads(data)
              result=raw.get('result',[]) or []
              print('Secret names only:',[b.get('name') for b in result])
          print('Read-only deployment safety audit done.')
          PY
