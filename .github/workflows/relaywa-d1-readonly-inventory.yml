name: RelayWA D1 Read-Only Inventory
on:
  push:
    branches: [maintenance/relaywa-d1-audit-20261014]
    paths: [.github/workflows/relaywa-d1-readonly-inventory.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Identify RelayWA D1 bindings (no data modifications)
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account || !token) {
            console.error('Cloudflare GitHub credentials missing; no modifications made.');
            process.exitCode=2;
          } else {
            const base='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account);
            async function get(path) {
              try {
                const response=await fetch(base+path,{
                  headers: { Authorization:'Bearer '+token, Accept:'application/json' },
                  signal:AbortSignal.timeout(15000),
                });
                const json=await response.json();
                if(!response.ok || !json.success) {
                  console.log('READ '+path.split('?')[0]+': unavailable ('+response.status+'; '+(json.errors?.[0]?.code??'unknown')+')');
                  return null;
                }
                return json.result;
              } catch(error) {
                console.log('READ '+path.split('?')[0]+': failed ('+error.name+')');
                return null;
              }
            }
            const databases=await get('/d1/database?per_page=100');
            const named=(Array.isArray(databases)?databases:[]).filter(d=>/relay.?wa/i.test(String(d.name??'')));
            console.log('D1 inventory: '+(Array.isArray(databases)?databases.length:'unavailable')+' databases in account; '+named.length+' RelayWA-named');
            const selected=new Map();
            for(const name of ['relaywa-api','relaywa-web','relaywa-platform']) {
              const settings=await get('/workers/scripts/'+name+'/settings');
              const bindings=settings?.bindings??[];
              const d1=bindings.filter(b=>/d1/i.test(String(b.type??'')));
              console.log('Worker '+name+': '+d1.length+' D1 bindings'+(!settings?' (settings unavailable)':''));
              for(const b of d1) {
                const id=b.id??b.database_id??b.databaseId;
                if(!id) {console.log(' D1 binding '+b.name+' lacks database ID');continue;}
                const meta=(Array.isArray(databases)?databases:[]).find(d=>d.uuid===id||d.id===id);
                console.log(' binding='+b.name+' database='+(meta?.name??'unknown')+' id='+id);
                selected.set(String(id),meta?.name??name);
              }
            }
            if(!selected.size) {
              console.log('NO_CONFIRMED_D1_BINDINGS: database data not queried.');
            }
            for(const [id,name] of selected) {
              const url=base+'/d1/database/'+encodeURIComponent(id)+'/query';
              async function query(sql) {
                try {
                  const response=await fetch(url,{method:'POST',headers:{
                    Authorization:'Bearer '+token,'Content-Type':'application/json'
                  },body:JSON.stringify({sql}),signal:AbortSignal.timeout(15000)});
                  const payload=await response.json();
                  if(!response.ok||!payload.success){
                    console.log('Database '+name+' query unavailable HTTP '+response.status+', code '+(payload.errors?.[0]?.code??'unknown'));
                    return null;
                  }
                  return payload.result?.[0]?.results??[];
                }catch(e){console.log('Database '+name+' query failed: '+e.name);return null;}
              }
              const tableRows=await query("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
              if(!tableRows) continue;
              const tables=tableRows.map(x=>x.name);
              console.log('Database '+name+' table names: '+tables.join(', '));
              for(const table of ['users','organizations','organization_memberships','organization_subscriptions','whatsapp_sessions','payments']) {
                if(!tables.includes(table))continue;
                const columns=await query("SELECT name FROM pragma_table_info('"+table+"')");
                console.log('Table '+table+' columns: '+(columns??[]).map(x=>x.name).join(', '));
                const count=await query('SELECT count(*) AS total FROM "'+table+'"');
                console.log('Table '+table+' rowcount: '+(count?.[0]?.total??'unavailable'));
              }
              const targetStatus=await query("SELECT lower(email) AS email,is_platform_admin,platform_role,CASE WHEN disabled_at IS NULL THEN 1 ELSE 0 END AS enabled FROM users WHERE lower(email) IN ('haider@relaywa.com','mrqkay@relaywa.com') ORDER BY email");
              console.log('Exact protected login accounts: '+JSON.stringify(targetStatus??[]));
              const allAdmins=await query("SELECT CASE WHEN lower(email) IN ('haider@relaywa.com','mrqkay@relaywa.com') THEN 'protected' ELSE 'other' END AS kind, count(*) AS total FROM users WHERE is_platform_admin=1 GROUP BY kind");
              console.log('Protected versus non-protected admins: '+JSON.stringify(allAdmins??[]));
              const membership=await query("SELECT lower(u.email) AS email,count(m.id) AS memberships FROM users u LEFT JOIN organization_memberships m ON m.user_id=u.id WHERE lower(u.email) IN ('haider@relaywa.com','mrqkay@relaywa.com') GROUP BY lower(u.email)");
              console.log('Protected account memberships: '+JSON.stringify(membership??[]));
              const schema=await query("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
              for(const t of schema??[]) {
                const fk=await query("SELECT \\"table\\" AS ref,\\\"from\\\" AS source,\\\"to\\\" AS target,on_delete FROM pragma_foreign_key_list('"+t.name+"')");
                if((fk??[]).length)console.log('FK '+t.name+': '+JSON.stringify(fk));
              }
              const b=await get('/d1/database/'+encodeURIComponent(id)+'/time_travel/bookmark');
              console.log('Preflight Time Travel bookmark: '+(b?.bookmark?'available':'unavailable'));

              const adminStats=await query("SELECT count(*) AS total, sum(CASE WHEN disabled_at IS NULL THEN 1 ELSE 0 END) AS enabled FROM users WHERE is_platform_admin=1");
              console.log('Platform admins summary: '+JSON.stringify(adminStats??[]));
              const qaisMatches=await query("SELECT count(*) AS total FROM users WHERE lower(email) LIKE '%qais%' OR lower(name) LIKE '%qais%'");
              console.log('Potential Qais-name matches (count only): '+JSON.stringify(qaisMatches??[]));
              const haiderOrg=await query("SELECT count(*) AS total FROM organization_memberships WHERE user_id IN (SELECT id FROM users WHERE lower(email)='haider@relaywa.com')");
              console.log('Protected Haider membership count: '+JSON.stringify(haiderOrg??[]));
              const protectedOrg=await query("SELECT count(DISTINCT organization_id) AS total FROM organization_memberships WHERE user_id IN (SELECT id FROM users WHERE lower(email) IN ('haider@relaywa.com','qais@relaywa.com'))");
              console.log('Organizations containing protected accounts: '+JSON.stringify(protectedOrg??[]));
              const subscriptionStates=await query("SELECT coalesce(provider,'internal') AS provider,status,count(*) AS total FROM organization_subscriptions GROUP BY coalesce(provider,'internal'),status ORDER BY provider,status");
              console.log('Subscriptions by provider and status: '+JSON.stringify(subscriptionStates??[]));
              const paymentStates=await query("SELECT provider,status,count(*) AS total FROM payments GROUP BY provider,status ORDER BY provider,status");
              console.log('Payments by provider and status: '+JSON.stringify(paymentStates??[]));
              const referential=await query("SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
              for(const record of referential??[]) {
                const table=record.name;
                const fk=await query("SELECT \"table\" AS target FROM pragma_foreign_key_list('"+table+"')");
                const relevant=(fk??[]).map(r=>r.target).filter(x=>['users','organizations','organization_subscriptions','whatsapp_sessions'].includes(x));
                if(relevant.length) console.log('Dependency '+table+' -> '+relevant.join(','));
              }

              if(tables.includes('users')) {
                const cols=(await query("SELECT name FROM pragma_table_info('users')"))?.map(r=>r.name)??[];
                if(cols.includes('email')) {
                  const flags=cols.includes('is_platform_admin')?',is_platform_admin':'';
                  const sql="SELECT email"+flags+" FROM users WHERE lower(email) IN ('qais@relaywa.com','haider@relaywa.com') ORDER BY email";
                  const admins=await query(sql);
                  console.log('Protected accounts present: '+JSON.stringify(admins??[]));
                }
              }
            }
          }
          NODE
