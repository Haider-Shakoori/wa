name: RelayWA Cloudflare Cookie Message Staging
on:
  push:
    branches: [feat/relaywa-cloudflare-cookie-message]
    paths: [.github/workflows/relaywa-cookie-message-stage.yml]
permissions:
  contents: read
concurrency:
  group: relaywa-cookie-staging
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install application dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build existing RelayWA Next.js HTML
        run: pnpm --filter @wa/web build
      - name: Build new Worker and execute safe unit tests
        shell: bash
        run: |
          pnpm --filter @wa/web exec next start -p 3000 > /tmp/relaywa-cookie-ssr.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then break; fi
            sleep 1
          done
          node --check ops/seo-overlay/cookie-message.js
          node ops/seo-overlay/build.mjs
          node --check ops/seo-overlay/dist/index.mjs
          node --test ops/seo-overlay/test.mjs
      - name: Check production custom domain and exact route collisions (read only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 ops/seo-overlay/routes.py check
      - name: Upload new separate staging Worker, not live SEO Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --config ops/seo-overlay/wrangler-cookie-staging.toml
      - name: Verify Cloudflare preview including transient edge propagation recovery
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SEO_PREVIEW_WORKER: relaywa-cookie-staging
        run: python3 ops/seo-overlay/smoke.py preview
      - name: Install Playwright browser test environment
        working-directory: tests/seo-e2e
        run: |
          npm install --no-audit --no-fund --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Test real desktop and mobile cookie choices in staging Chromium
        working-directory: tests/seo-e2e
        env:
          SEO_E2E_ORIGIN: https://relaywa-cookie-staging.relaywa8.workers.dev
        run: npx playwright test --config=playwright.config.cjs --grep @cookie
