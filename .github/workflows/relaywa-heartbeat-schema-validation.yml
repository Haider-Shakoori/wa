name: RelayWA D1 heartbeat schema validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/relaywa-heartbeat-schema-validation.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check D1 heartbeat statement and table constraints
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const h={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          async function api(path,init={}){
            const r=await fetch(root+path,{...init,headers:{...h,...init.headers}});
            const j=await r.json();
            if(!r.ok||!j.success)throw Error('Cloudflare '+r.status+' '+JSON.stringify(j.errors?.map(x=>x.code)));
            return j.result;
          }
          const db=(await api('/d1/database?per_page=100')).find(x=>x.name==='relaywa');
          if(!db)throw Error('D1 database unavailable');
          for(const sql of ["SELECT sql FROM sqlite_master WHERE name='relaywa_worker_heartbeats'","PRAGMA index_list('relaywa_worker_heartbeats')","EXPLAIN INSERT INTO relaywa_worker_heartbeats (worker_id,first_seen_at,last_seen_at) VALUES ('diagnostic-only',datetime('now'),datetime('now')) ON CONFLICT(worker_id) DO UPDATE SET last_seen_at=datetime('now')"]){
            const r=await fetch(root+'/d1/database/'+db.uuid+'/query',{method:'POST',headers:{...h,'content-type':'application/json'},body:JSON.stringify({sql})});
            const j=await r.json();
            console.log('RESULT',sql.split(' ')[0],JSON.stringify({status:r.status,success:j.success,error:j.errors?.map(e=>e.message),rows:sql.startsWith('EXPLAIN')?undefined:j.result?.[0]?.results}));
          }
          NODE
