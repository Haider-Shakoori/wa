name: RelayWA D1 heartbeat SQL verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/relaywa-d1-heartbeat-sql-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate SQL without changing production data
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN};
          async function get(path,options={}){
            const r=await fetch(root+path,{...options,headers:{...headers,...options.headers}});
            const d=await r.json();
            if(!r.ok||!d.success)throw Error('Cloudflare API '+r.status+' '+JSON.stringify(d.errors?.map(e=>e.code)));
            return d.result;
          }
          const db=(await get('/d1/database?per_page=100')).find(x=>x.name==='relaywa');
          if(!db)throw Error('relaywa database unavailable');
          async function query(sql){
            const r=await fetch(root+'/d1/database/'+db.uuid+'/query',{method:'POST',headers:{...headers,'content-type':'application/json'},body:JSON.stringify({sql})});
            const d=await r.json();
            console.log('SQL_TEST',JSON.stringify({status:r.status,success:d.success,errors:d.errors?.map(x=>({code:x.code,message:String(x.message).slice(0,180)})),statementSuccess:d.result?.[0]?.success}));
          }
          await query("EXPLAIN INSERT INTO relaywa_worker_heartbeats (worker_id, first_seen_at, last_seen_at) VALUES ('diagnostic-not-inserted', datetime('now'), datetime('now')) ON CONFLICT(worker_id) DO UPDATE SET last_seen_at=datetime('now')");
          await query("EXPLAIN INSERT INTO relaywa_worker_heartbeats (worker_id, first_seen_at, last_seen_at)\\n VALUES ('diagnostic-not-inserted', datetime('now'), datetime('now'))\\n ON CONFLICT(worker_id) DO UPDATE SET last_seen_at=datetime('now')");
          console.log('READ_ONLY_SQL_VERIFICATION_COMPLETE');
          NODE
