name: SDK release candidate (build only)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PREPARE_ONLY to build SDK artifacts without publishing'
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    if: ${{ inputs.confirmation == 'PREPARE_ONLY' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Offline SDK contract tests
        run: |
          PYTHONPATH=sdks/python python -m unittest discover -s sdks/python/tests -v
          php -l sdks/php/src/Client.php
          php sdks/php/tests/smoke.php
          dotnet run --project sdks/dotnet/RelayWA.ContractTests/RelayWA.ContractTests.csproj -c Release
      - name: Build TypeScript in isolated workspace
        run: |
          mkdir -p /tmp/relaywa-sdk-build release-candidate/npm
          cp -a packages/sdk-typescript/. /tmp/relaywa-sdk-build/
          cd /tmp/relaywa-sdk-build
          npm install --ignore-scripts --no-audit --no-fund --package-lock=false
          npm run build
          cp -a dist "$GITHUB_WORKSPACE/packages/sdk-typescript/dist"
          cd "$GITHUB_WORKSPACE/packages/sdk-typescript"
          node --test test/*.test.mjs
          cd /tmp/relaywa-sdk-build
          npm pack --pack-destination "$GITHUB_WORKSPACE/release-candidate/npm" --silent
      - name: Build Python wheel and sdist
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build sdks/python --outdir release-candidate/pypi
      - name: Build NuGet package
        run: dotnet pack sdks/dotnet/RelayWA/RelayWA.csproj -c Release -o release-candidate/nuget
      - name: Prepare Composer source snapshot
        run: |
          mkdir -p release-candidate/composer
          tar -czf release-candidate/composer/relaywa-php-sdk-source.tar.gz -C sdks/php --exclude='vendor' .
      - name: Verify package archives and MIT notices
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import glob, tarfile, zipfile
          root=Path('release-candidate')
          npm=glob.glob(str(root/'npm/*.tgz'))
          wheel=glob.glob(str(root/'pypi/*.whl'))
          nupkg=glob.glob(str(root/'nuget/*.nupkg'))
          composer=glob.glob(str(root/'composer/*.tar.gz'))
          assert all(len(x)==1 for x in (npm,wheel,nupkg,composer)), 'Expected one artifact per SDK'
          with tarfile.open(npm[0]) as t:
              names=t.getnames()
              assert 'package/LICENSE' in names and 'package/dist/index.js' in names and 'package/dist/index.d.ts' in names
          with zipfile.ZipFile(wheel[0]) as z:
              names=z.namelist()
              assert any('license' in x.lower() for x in names) and any(x.endswith('relaywa/__init__.py') for x in names)
          with zipfile.ZipFile(nupkg[0]) as z:
              names=z.namelist()
              assert any(x.upper().endswith('LICENSE') for x in names) and any(x.endswith('RelayWA.dll') for x in names)
          with tarfile.open(composer[0]) as t:
              assert any(x.endswith('/LICENSE') for x in t.getnames())
          print('All four SDK artifact archives validated (no network API calls).')
          PY
      - name: Produce SHA256 manifest
        run: |
          cd release-candidate
          find npm pypi nuget composer -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload review-only release candidate
        uses: actions/upload-artifact@v4
        with:
          name: relaywa-sdk-release-candidate
          path: release-candidate/
          retention-days: 7
