name: RelayWA inspect Cloudflare custom domains and DNS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/relaywa-emergency-domains-20261109.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect routing without changes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4',zone='80963d61146f7f3ec51f793e6b8de8d9',h={authorization:'Bearer '+process.env.CF_TOKEN};
          for(const [label,url] of [['WORKER_DOMAINS',root+'/accounts/'+process.env.CF_ACCOUNT+'/workers/domains'],['DNS',root+'/zones/'+zone+'/dns_records?per_page=100'],['WORKER_ROUTES',root+'/zones/'+zone+'/workers/routes']]){
            const r=await fetch(url,{headers:h});const j=await r.json();console.log(label,r.status,j.success,JSON.stringify(j.errors||[]));
            console.log(JSON.stringify((j.result||[]).filter(x=>label!=='DNS'||/relaywa|^api\.|^platform\./.test(x.name||'')).map(x=>({id:x.id,hostname:x.hostname,service:x.service,environment:x.environment,zone_name:x.zone_name,name:x.name,type:x.type,proxied:x.proxied,content:label==='DNS'&&x.type==='CNAME'?x.content:undefined,pattern:x.pattern,script:x.script}))).slice(0,15000))
          }
          NODE
