name: RelayWA live request source audit (read-only)
on:
  push:
    branches: ['audit/relaywa-request-sources-20261015']
    paths: ['.github/workflows/relaywa-request-source-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect deployed Workers and recent request paths without changes
        run: |
          node --input-type=module <<'NODE'
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          if(!token||!account) throw Error('Cloudflare credentials are missing');
          const headers={authorization:'Bearer '+token};
          const root='https://api.cloudflare.com/client/v4';
          async function get(path) {
            const r=await fetch(root+path,{headers,signal:AbortSignal.timeout(15000)});
            const j=await r.json();
            if(!r.ok||!j.success) throw Error('Cloudflare HTTP '+r.status+' error codes: '+JSON.stringify(j.errors?.map(x=>x.code)??[]));
            return j.result;
          }
          for(const name of ['relaywa-api','relaywa-platform','relaywa-web']){
            try {
              const settings=await get('/accounts/'+account+'/workers/scripts/'+name+'/settings');
              console.log('WORKER '+name+' BINDING_TYPES '+JSON.stringify((settings.bindings??[]).map(b=>({name:b.name,type:b.type}))));
              const response=await fetch(root+'/accounts/'+account+'/workers/scripts/'+name,{headers,signal:AbortSignal.timeout(15000)});
              if(!response.ok) {console.log('WORKER_SOURCE '+name+' HTTP '+response.status);continue;}
              let files=[];
              if((response.headers.get('content-type')??'').includes('multipart/form-data')){
                const form=await response.formData();
                for(const [key,item] of form.entries())files.push({name:key,source:typeof item==='string'?item:await item.text()});
              }else files=[{name:'script',source:await response.text()}];
              const joined=files.map(f=>f.source).join('\n');
              const patterns=['/whatsapp-sessions/:sessionId/events','/whatsapp-sessions/:id/events','/internal/worker/commands','/internal/worker/messages/poll','/internal/worker/heartbeat','text/event-stream','session.reconnecting','session.connected'];
              console.log('WORKER_SOURCE '+name+' MODULES='+files.length+' FLAGS='+JSON.stringify(Object.fromEntries(patterns.map(p=>[p,joined.includes(p)]))));
            }catch(e){console.log('WORKER_AUDIT_ERROR '+name+' '+e.message);}
          }
          try {
            const zones=await get('/zones?name=relaywa.com&per_page=10');
            const zone=zones.find(z=>z.name==='relaywa.com');
            if(!zone)throw Error('zone not visible to API token');
            const since=new Date(Date.now()-24*60*60*1000).toISOString();
            const until=new Date().toISOString();
            const query=`query($zone:String!,$since:Time!,$until:Time!){viewer{zones(filter:{zoneTag:$zone}){httpRequestsAdaptiveGroups(limit:60,orderBy:[count_DESC],filter:{datetime_geq:$since,datetime_lt:$until}){count dimensions{clientRequestPath edgeResponseStatus}}}}}`;
            const response=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{...headers,'content-type':'application/json'},body:JSON.stringify({query,variables:{zone:zone.id,since,until}}),signal:AbortSignal.timeout(25000)});
            const data=await response.json();
            if(data.errors?.length)throw Error('GraphQL error codes or messages: '+JSON.stringify(data.errors.map(e=>String(e.message).slice(0,180))));
            const groups=data.data?.viewer?.zones?.[0]?.httpRequestsAdaptiveGroups??[];
            console.log('TOP_REQUEST_PATHS_24H '+JSON.stringify(groups.map(g=>({path:g.dimensions.clientRequestPath,status:g.dimensions.edgeResponseStatus,count:g.count}))));
          }catch(e){console.log('ANALYTICS_UNAVAILABLE '+e.message);}
          console.log('READ_ONLY_RELAYWA_AUDIT_COMPLETE');
          NODE
