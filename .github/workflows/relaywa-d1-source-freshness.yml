name: RelayWA D1 source freshness (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read current production D1 aggregate counts
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const {CF_TOKEN,CF_ACCOUNT}=process.env;
          if(!CF_TOKEN||!CF_ACCOUNT)throw Error('Cloudflare credentials missing');
          const base=`https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}`;
          async function request(path,init={}){
            const response=await fetch(base+path,{...init,headers:{Authorization:`Bearer ${CF_TOKEN}`,'Content-Type':'application/json'}});
            const body=await response.json();
            if(!response.ok||!body.success)throw Error(`Cloudflare read error ${response.status}: ${JSON.stringify(body.errors||[])}`);
            return body.result;
          }
          const databases=await request('/d1/database?per_page=100');
          const database=databases.find(item=>item.name==='relaywa');
          if(!database)throw Error('RelayWA D1 database not found');
          const tables=['users','organizations','whatsapp_sessions','messages','session_events','contacts','api_keys','payments','subscription_usage','payment_provider_settings'];
          const statement=tables.map(table=>`SELECT '${table}' AS table_name, COUNT(*) AS row_count FROM "${table}"`).join(' UNION ALL ');
          const result=await request(`/d1/database/${database.uuid}/query`,{method:'POST',body:JSON.stringify({sql:statement})});
          const rows=result.flatMap(batch=>batch.results||[]);
          if(rows.length!==tables.length)throw Error('Incomplete D1 aggregate result');
          console.log('D1_CHECKED_AT',new Date().toISOString());
          for(const row of rows)console.log('D1_COUNT',row.table_name,Number(row.row_count));
          console.log('SNAPSHOT_REFERENCE',JSON.stringify({users:5,organizations:5,whatsapp_sessions:7,messages:23702,session_events:24372,contacts:3955,api_keys:7,payments:1,subscription_usage:20,payment_provider_settings:2}));
          console.log('READ_ONLY_CHECK_COMPLETE');
          NODE
