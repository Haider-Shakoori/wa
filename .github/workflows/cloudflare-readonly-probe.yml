name: Cloudflare Read-only Connection Probe

on:
  push:
    branches: [chore/cloudflare-readonly-probe]
    paths:
      - .github/workflows/cloudflare-readonly-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Verify existing Cloudflare secrets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inventory current Cloudflare routing and deployed projects (GET only)
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cloudflare-readonly-inventory.py
      - name: Verify token, Workers, Pages, and RelayWA zone (GET only)
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          token = os.environ.get("CF_API_TOKEN", "")
          account = os.environ.get("CF_ACCOUNT_ID", "")
          if not token or not account:
              print("ERROR: Required repository secrets are missing: CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID.")
              sys.exit(1)

          def check(label, path):
              req = Request("https://api.cloudflare.com/client/v4/" + path,
                            headers={"Authorization": "Bearer " + token,
                                     "Accept": "application/json"},
                            method="GET")
              try:
                  with urlopen(req, timeout=15) as response:
                      data = json.load(response)
                  if not data.get("success", False):
                      print(label + ": Cloudflare API reported failure")
                      return False, None
                  print(label + ": accessible")
                  return True, data.get("result")
              except HTTPError as e:
                  print(label + ": HTTP " + str(e.code))
                  return False, None
              except (URLError, TimeoutError, ValueError) as e:
                  print(label + ": request failed (" + type(e).__name__ + ")")
                  return False, None

          valid, token_info = check("API token", "user/tokens/verify")
          if not valid or not isinstance(token_info, dict) or token_info.get("status") != "active":
              print("ERROR: Cloudflare token verification did not confirm an active token.")
              sys.exit(1)

          workers, _ = check("Workers API", "accounts/" + account + "/workers/scripts")
          pages, _ = check("Pages API", "accounts/" + account + "/pages/projects")
          zones, zone_info = check("Zones API", "zones?name=relaywa.com")
          if zones and isinstance(zone_info, list):
              print("relaywa.com zone visible: " + ("yes" if any(z.get("name") == "relaywa.com" for z in zone_info) else "no"))

          if not (workers or pages or zones):
              print("ERROR: Token verified, but no targeted Cloudflare resource was accessible.")
              sys.exit(1)

          print("Cloudflare read-only connectivity probe completed. No writes or deployments performed.")
          PY
