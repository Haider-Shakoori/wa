name: RelayWA diagnose D1 production health read only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/relaywa-d1-health-diagnostic-20261109.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Inspect D1 metadata and query error without modifying data
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(process.env.CF_ACCOUNT);
          const id='967df9ac-f1f7-468f-86d8-cfb04ac3b752';
          async function check(label,path,options={}) {
            try {
              const r=await fetch(root+path,{...options,headers:{authorization:'Bearer '+process.env.CF_TOKEN,'content-type':'application/json'}});
              const j=await r.json();
              console.log(label,'HTTP',r.status,'success',j.success,'errors',JSON.stringify(j.errors||[]),'result',JSON.stringify(j.result||{}).slice(0,900));
            } catch(e){console.log(label,'EXCEPTION',e.message)}
          }
          await check('D1_METADATA','/d1/database/'+id);
          await check('D1_READ_QUERY','/d1/database/'+id+'/query',{method:'POST',body:JSON.stringify({sql:'SELECT 1 AS ok'})});
          await check('D1_HEARTBEAT_READ','/d1/database/'+id+'/query',{method:'POST',body:JSON.stringify({sql:"SELECT worker_id,last_seen_at FROM relaywa_worker_heartbeats ORDER BY last_seen_at DESC LIMIT 1"})});
          await check('D1_DATABASE_LIST','/d1/database?per_page=20');
          NODE
