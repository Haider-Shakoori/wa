name: RelayWA D1 Dependency Audit
on:
  push:
    branches: [maintenance/relaywa-d1-audit-20261014]
    paths:
      - .github/workflows/relaywa-d1-dependency-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect relationships without mutations
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const url='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database';
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'content-type':'application/json'};
          async function req(u,body){
            const r=await fetch(u,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined});
            const j=await r.json();
            if(!r.ok||!j.success)throw Error('HTTP '+r.status+' Cloudflare API failure');
            return j.result;
          }
          const candidates=(await req(url+'?per_page=100')).filter(d=>d.name==='relaywa');
          if(candidates.length!==1)throw Error('Database not unique');
          const base=url+'/'+candidates[0].uuid;
          async function q(sql){return (await req(base+'/query',{sql}))?.[0]?.results??[];}
          const adm=await q("SELECT lower(email) AS email FROM users WHERE is_platform_admin=1 AND disabled_at IS NULL AND lower(email) IN ('haider@relaywa.com','mr.qkay@relaywa.com')");
          if(adm.length!==2)throw Error('Protected pair not confirmed');
          console.log('PROTECTED_PAIR_OK');
          const ddl=await q("SELECT name,sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
          for(const row of ddl){
            const sql=String(row.sql||'');
            const refs=[];
            for(const m of sql.matchAll(/REFERENCES +["']?([a-z0-9_]+)/gi)){
              refs.push(m[1]);
            }
            console.log('DEPENDENCY '+row.name+': '+refs.join(','));
          }
          const protectedMemberships=await q("SELECT lower(u.email) AS email,count(m.id) AS n FROM users u LEFT JOIN organization_memberships m ON m.user_id=u.id WHERE lower(u.email) IN ('haider@relaywa.com','mr.qkay@relaywa.com') GROUP BY lower(u.email) ORDER BY email");
          console.log('ADMIN_MEMBERSHIPS '+JSON.stringify(protectedMemberships));
          const protectedOrgs=await q("SELECT count(DISTINCT m.organization_id) AS n FROM organization_memberships m JOIN users u ON u.id=m.user_id WHERE lower(u.email) IN ('haider@relaywa.com','mr.qkay@relaywa.com')");
          console.log('PROTECTED_ORGANIZATIONS '+JSON.stringify(protectedOrgs));
          const linkedPaid=await q("SELECT count(*) AS n FROM payments WHERE organization_id IN (SELECT m.organization_id FROM organization_memberships m JOIN users u ON u.id=m.user_id WHERE lower(u.email) IN ('haider@relaywa.com','mr.qkay@relaywa.com'))");
          console.log('PAYMENTS_IN_PROTECTED_ORGS '+JSON.stringify(linkedPaid));
          const bookmark=await req(base+'/time_travel/bookmark');
          if(!bookmark.bookmark)throw Error('Missing recovery bookmark');
          console.log('BOOKMARK_AVAILABLE');
          NODE
