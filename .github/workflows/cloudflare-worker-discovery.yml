name: Cloudflare Live Worker Source Discovery (read only)

on:
  push:
    branches: [feat/ga4-cloudflare-credentials]
    paths:
      - .github/workflows/cloudflare-worker-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Identify serving Workers and GA4 handler source
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Worker metadata and scan source without printing source or secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError
          from urllib.parse import quote
          from email.parser import BytesParser
          from email.policy import default
          token,account=os.getenv('CF_TOKEN',''),os.getenv('CF_ACCOUNT','')
          if not token or not account:
              raise SystemExit('Missing Cloudflare API credentials')
          root='https://api.cloudflare.com/client/v4/'
          def get(url):
              req=Request(root+url,headers={'Authorization':'Bearer '+token,'Accept':'*/*'},method='GET')
              try:
                  with urlopen(req,timeout=15) as r:
                      body=r.read(8_000_000)
                      return r.status,r.headers.get('Content-Type',''),body
              except HTTPError as e: return e.code,'',b''
              except (URLError,TimeoutError): return 0,'',b''
          def json_result(endpoint):
              status,kind,body=get(endpoint)
              if status!=200:return status,None
              try:
                  data=json.loads(body)
                  return status,data.get('result') if data.get('success') else None
              except Exception:return status,None
          status,domains=json_result('accounts/'+quote(account,safe='')+'/workers/domains')
          if isinstance(domains,list):
              for item in domains:
                  hostname=item.get('hostname','')
                  if hostname=='relaywa.com' or hostname.endswith('.relaywa.com'):
                      print('Domain route:',hostname,'->',item.get('service','unknown'),'environment:',item.get('environment','unknown'))
          else:print('Custom Worker domains endpoint status:',status)

          for name in ('relaywa-api','relaywa-platform','relaywa-web'):
              endpoint='accounts/'+quote(account,safe='')+'/workers/scripts/'+quote(name,safe='')
              status,kind,body=get(endpoint)
              print('Worker:',name,'script GET status:',status)
              if status!=200: continue
              print('Bundle type:',kind.split(';')[0],'bytes:',len(body),'sha256:',hashlib.sha256(body).hexdigest()[:20])
              parts=[]
              if kind.lower().startswith('multipart/'):
                  message=BytesParser(policy=default).parsebytes(b'Content-Type: '+kind.encode()+b'\r\nMIME-Version: 1.0\r\n\r\n'+body)
                  for part in message.iter_parts():
                      filename=part.get_filename() or part.get_param('name',header='content-disposition') or 'module'
                      content=part.get_payload(decode=True) or b''
                      if len(content)<6_000_000: parts.append((filename,content))
              else:parts.append(('entrypoint',body))
              for filename,chunk in parts[:25]:
                  # Do not print source. Print only allowlisted counts and checks.
                  lowered=chunk.lower()
                  print('  Module:',filename[:110],'bytes:',len(chunk),
                        'GA4 route mentions:',lowered.count(b'google-analytics'),
                        'GA4 credential mentions:',lowered.count(b'ga4_service_account'),
                        'API platform mentions:',lowered.count(b'/api/platform'),
                        'reporting mentions:',lowered.count(b'analyticsdata.googleapis.com'),
                        'OAuth mentions:',lowered.count(b'oauth2.googleapis.com'))
          print('Read-only discovery finished. No secrets, Worker source or credentials printed.')
          PY
