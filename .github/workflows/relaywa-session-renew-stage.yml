name: Stage RelayWA Platform Session Renewal
on:
  push:
    branches: [fix/relaywa-platform-auth-renewal]
    paths:
      - .github/workflows/relaywa-session-renew-stage.yml
      - ops/relaywa-auth-renewal/**
permissions: {contents: read}
concurrency: {group: relaywa-platform-session-renewal, cancel-in-progress: false}
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check ops/relaywa-auth-renewal/patch-platform.mjs && node --check ops/relaywa-auth-renewal/browser-renewal.js && node --check ops/relaywa-auth-renewal/stage.mjs
      - run: node ops/relaywa-auth-renewal/stage.mjs
