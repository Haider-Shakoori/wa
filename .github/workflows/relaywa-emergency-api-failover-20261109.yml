name: RelayWA emergency website API failover to VPS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/relaywa-emergency-api-failover-20261109.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  failover:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Deploy narrowly scoped API failover and verify with rollback
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const base='https://api.cloudflare.com/client/v4',zone='80963d61146f7f3ec51f793e6b8de8d9',script='relaywa-emergency-api-vps',pattern='relaywa.com/api/*';
          const auth={Authorization:'Bearer '+process.env.CF_TOKEN};
          async function api(path,options={}){const r=await fetch(base+path,{...options,headers:{...auth,...options.headers}});const j=await r.json();if(!r.ok||!j.success)throw Error(path+' '+r.status+' '+JSON.stringify(j.errors));return j.result}
          const code=`export default {async fetch(request) {
            const incoming=new URL(request.url);
            if(!incoming.pathname.startsWith('/api/'))return new Response('Not Found',{status:404});
            const billing=/^\\/api\\/(?:payments\\/|stripe\\/|billing\\/|webhooks\\/stripe)/i.test(incoming.pathname);
            const target=new URL(incoming.pathname+incoming.search,billing?'https://relaywa-api.relaywa8.workers.dev':'https://relaywa-vps-origin.relaywa.com');
            const headers=new Headers(request.headers);headers.delete('host');
            const upstream=await fetch(new Request(target.toString(),{method:request.method,headers,body:['GET','HEAD'].includes(request.method)?undefined:request.body,redirect:'manual'}));
            const out=new Response(upstream.body,upstream);
            out.headers.set('x-relaywa-api-route',billing?'cloudflare-billing':'vps-emergency');
            return out;
          }}`;
          const form=new FormData();
          form.append('metadata',new Blob([JSON.stringify({main_module:'index.js',compatibility_date:'2026-10-01'})],{type:'application/json'}));
          form.append('index.js',new Blob([code],{type:'application/javascript+module'}),'index.js');
          await api('/accounts/'+process.env.CF_ACCOUNT+'/workers/scripts/'+script,{method:'PUT',body:form});
          console.log('SCRIPT_DEPLOYED',script);
          const before=await api('/zones/'+zone+'/workers/routes');
          if(before.some(r=>r.pattern===pattern))throw Error('Existing API route: refusing to overwrite');
          const route=await api('/zones/'+zone+'/workers/routes',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pattern,script})});
          console.log('ROUTE_CREATED',route.id);
          try {
            let good=false;
            for(let i=0;i<5;i++){
              await new Promise(resolve=>setTimeout(resolve,1800));
              const r=await fetch('https://relaywa.com/api/health',{headers:{'cache-control':'no-cache'}});
              const t=await r.text();console.log('CHECK',i,r.status,r.headers.get('x-relaywa-api-route'),t.slice(0,120));
              if(r.ok&&r.headers.get('x-relaywa-api-route')==='vps-emergency'&&t.includes('relaywa-api')){good=true;break}
            }
            if(!good)throw Error('Health check did not verify VPS routing');
            const authCheck=await fetch('https://relaywa.com/api/auth/providers');
            console.log('AUTH_PROVIDER',authCheck.status,authCheck.headers.get('x-relaywa-api-route'));
            if(!authCheck.ok)throw Error('Auth provider check failed');
            console.log('FAILOVER_VERIFIED');
          }catch(e){
            console.log('ROLLBACK_REASON',e.message);
            await api('/zones/'+zone+'/workers/routes/'+route.id,{method:'DELETE'});
            console.log('ROUTE_REMOVED');
            throw e;
          }
          NODE
