name: Stage RelayWA Platform Session Statistics
on:
  push:
    branches: [fix/platform-session-statistics]
    paths:
      - .github/workflows/platform-session-statistics.yml
      - ops/relaywa-platform-statistics/**
permissions: {contents: read}
concurrency: {group: relaywa-platform-statistics, cancel-in-progress: false}
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node --check ops/relaywa-platform-statistics/stage.mjs && node --check ops/relaywa-platform-statistics/patch-platform.mjs && node --check ops/relaywa-platform-statistics/patch-web.mjs
      - run: node ops/relaywa-platform-statistics/stage.mjs
