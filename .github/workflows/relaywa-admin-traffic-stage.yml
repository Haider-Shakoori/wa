name: Stage Live RelayWA Admin Statistics Chunk
on:
  push:
    branches: [fix/admin-live-traffic-chunk]
    paths:
      - .github/workflows/relaywa-admin-traffic-stage.yml
permissions: {contents: read}
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: node ops/relaywa-platform-statistics/stage-traffic.mjs
