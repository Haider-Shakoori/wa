name: RelayWA Batch 2 isolated worker and reverse-sync integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/relaywa-batch2-isolated-integration.yml
permissions:
  contents: read
jobs:
  isolated-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: relaywa_test
          POSTGRES_PASSWORD: relaywa_test_local_only
          POSTGRES_DB: relaywa_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relaywa_test -d relaywa_e2e"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://relaywa_test:relaywa_test_local_only@127.0.0.1:5432/relaywa_e2e
      API_PORT: '39101'
      JWT_SECRET: relaywa_isolated_ci_jwt_secret_not_for_production_123456
      SESSION_ENCRYPTION_KEY: 1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef
      WORKER_DISPATCH_SECRET: isolated-ci-worker-secret-never-used-in-production
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --dir apps/api build
      - run: pnpm --dir apps/api migrate
      - name: Start isolated API
        run: |
          cd apps/api
          node dist/main.js > "$RUNNER_TEMP/relaywa-batch2-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/relaywa-batch2-api.pid"
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:39101/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          cat "$RUNNER_TEMP/relaywa-batch2-api.log"
          exit 1
      - name: Real HTTP worker bridge and real-table reverse-sync rehearsal
        working-directory: apps/api
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {randomUUID} from 'node:crypto';
          import pg from 'pg';
          const db=new pg.Client({connectionString:process.env.DATABASE_URL});
          await db.connect();
          const base='http://127.0.0.1:39101/internal/worker';
          const secret=process.env.WORKER_DISPATCH_SECRET;
          const workerId='ci-isolated-worker';
          async function post(path,body,token=secret){
            const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify({workerId,...body})});
            return {status:r.status,data:await r.json().catch(()=>({}))};
          }
          try{
            assert.equal((await post('/sessions/recoverable',{limit:1,connectingStaleMs:0,leaseMs:30000},null)).status,403);
            assert.equal((await post('/sessions/recoverable',{limit:1,connectingStaleMs:0,leaseMs:30000},'invalid-secret')).status,403);
            const recovered=await post('/sessions/recoverable',{limit:1,connectingStaleMs:0,leaseMs:30000});
            assert.equal(recovered.status,200,JSON.stringify(recovered));
            assert.ok(Array.isArray(recovered.data.sessions));
            console.log('PASS real authenticated worker bridge HTTP and denied invalid credentials');
            // Exercise real application table structures in disposable source and target schemas.
            // No production or restored customer rows are accessible in this runner.
            await db.query('BEGIN');
            await db.query('CREATE SCHEMA batch2_source');
            await db.query('CREATE SCHEMA batch2_target');
            await db.query('CREATE TABLE batch2_source.whatsapp_sessions (LIKE public.whatsapp_sessions INCLUDING ALL)');
            await db.query('CREATE TABLE batch2_target.whatsapp_sessions (LIKE public.whatsapp_sessions INCLUDING ALL)');
            // Use an actual application row, generated by registration, for source/target parity.
            const email='batch2-'+randomUUID()+'@example.invalid';
            const register=await fetch('http://127.0.0.1:39101/api/auth/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:'Batch2 CI',email,password:'isolated-ci-password-123456',organizationName:'Batch2 isolated'})});
            assert.equal(register.status,201,await register.text());
            const org=await db.query('SELECT id FROM organizations ORDER BY created_at DESC LIMIT 1');
            assert.equal(org.rowCount,1);
            // The real session table has FK and mandatory columns: clone and compare a row using
            // an explicit insert only when the application schema permits it.
            const sessionId=randomUUID();
            await db.query("INSERT INTO whatsapp_sessions(id,organization_id,status) VALUES($1,$2,'disconnected')",[sessionId,org.rows[0].id]);
            const claimed=await post('/sessions/recoverable',{limit:100,connectingStaleMs:0,leaseMs:30000});
            assert.equal(claimed.status,200,JSON.stringify(claimed));
            assert.ok(claimed.data.sessions.some(x=>x.id===sessionId),'synthetic session not claimed');
            const foreign=await post('/sessions/status',{sessionId,status:'connected',workerId:'another-worker'});
            assert.equal(foreign.status,200);
            assert.equal(foreign.data.updated,false,'foreign worker modified leased session');
            const owned=await post('/sessions/status',{sessionId,status:'connected'});
            assert.equal(owned.status,200);
            assert.equal(owned.data.updated,true);
            console.log('PASS actual session claim, lease isolation and owner status update');
            await db.query('INSERT INTO batch2_source.whatsapp_sessions SELECT * FROM public.whatsapp_sessions WHERE id=$1',[sessionId]);
            await db.query('INSERT INTO batch2_target.whatsapp_sessions SELECT * FROM batch2_source.whatsapp_sessions');
            const hash=async schema=>(await db.query(`SELECT md5(row_to_json(s)::text) AS hash FROM ${schema}.whatsapp_sessions s WHERE id=$1`,[sessionId])).rows[0]?.hash;
            assert.equal(await hash('batch2_source'),await hash('batch2_target'));
            await db.query("UPDATE batch2_source.whatsapp_sessions SET status='disconnected' WHERE id=$1",[sessionId]);
            await db.query('DELETE FROM batch2_target.whatsapp_sessions WHERE id=$1',[sessionId]);
            await db.query('INSERT INTO batch2_target.whatsapp_sessions SELECT * FROM batch2_source.whatsapp_sessions WHERE id=$1',[sessionId]);
            assert.equal(await hash('batch2_source'),await hash('batch2_target'));
            // Replaying an identical event must not create duplicate rows.
            await db.query('INSERT INTO batch2_target.whatsapp_sessions SELECT * FROM batch2_source.whatsapp_sessions WHERE id=$1 ON CONFLICT (id) DO NOTHING',[sessionId]);
            assert.equal((await db.query('SELECT count(*)::int AS n FROM batch2_target.whatsapp_sessions')).rows[0].n,1);
            await db.query('DELETE FROM batch2_source.whatsapp_sessions WHERE id=$1',[sessionId]);
            await db.query('DELETE FROM batch2_target.whatsapp_sessions WHERE id=$1',[sessionId]);
            assert.equal((await db.query('SELECT count(*)::int AS n FROM batch2_target.whatsapp_sessions')).rows[0].n,0);
            console.log('PASS real-schema reverse-sync insert, update, idempotent replay, delete and row hashes');
            await db.query('ROLLBACK');
          }catch(e){await db.query('ROLLBACK').catch(()=>{});throw e}finally{await db.end()}
          NODE
      - name: Diagnostics on failure
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/relaywa-batch2-api.log" 2>/dev/null || true
      - name: Stop isolated API
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/relaywa-batch2-api.pid" ]; then kill "$(cat "$RUNNER_TEMP/relaywa-batch2-api.pid")" 2>/dev/null || true; fi
