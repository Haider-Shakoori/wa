name: RelayWA D1 Cleanup Schema Inspection
on:
  push:
    branches: [maintenance/relaywa-d1-audit-20261014]
    paths:
      - .github/workflows/relaywa-d1-cleanup-schema.yml
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Inspect foreign key dependency schema (read only)
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const root='https://api.cloudflare.com/client/v4/accounts/'+process.env.CLOUDFLARE_ACCOUNT_ID+'/d1/database';
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,'Content-Type':'application/json'};
          async function cf(url,body){
            const r=await fetch(url,{method:body?'POST':'GET',headers,body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(18000)});
            const j=await r.json();
            if(!r.ok||!j.success)throw Error('D1 API '+r.status+' '+JSON.stringify(j.errors?.map(x=>x.code)));
            return j.result;
          }
          const matches=(await cf(root+'?per_page=100')).filter(x=>x.name==='relaywa');
          if(matches.length!==1)throw Error('No unique RelayWA database');
          const url=root+'/'+matches[0].uuid;
          async function q(sql){const x=await cf(url+'/query',{sql});return x?.[0]?.results??[];}
          const accounts=await q("SELECT lower(email) AS email,is_platform_admin AS admin,CASE WHEN disabled_at IS NULL THEN 1 ELSE 0 END AS enabled FROM users WHERE lower(email) IN ('haider@relaywa.com','mr.qkay@relaywa.com') ORDER BY email");
          if(accounts.length!==2||accounts.some(x=>x.admin!==1||x.enabled!==1))throw Error('Exact protected admin validation failed');
          console.log('PROTECTED_USERS '+JSON.stringify(accounts));
          const ddl=await q("SELECT name,sql FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name");
          for(const row of ddl){
            const sql=String(row.sql??'');
            const matches=[...sql.matchAll(/REFERENCES\\s+["']?([A-Za-z0-9_]+)/gi)].map(m=>m[1]);
            console.log('SCHEMA '+row.name+' parents='+matches.join(',')+' chars='+sql.length);
            if(['users','organizations','organization_memberships','whatsapp_sessions','payments','enterprise_accounts','platform_admin_audit_logs','platform_login_events'].includes(row.name)){
              console.log('DDL '+row.name+'='+sql);
            }
          }
          const b=await cf(url+'/time_travel/bookmark');
          if(!b.bookmark)throw Error('Time Travel unavailable');
          console.log('RECOVERY_BOOKMARK_OK');
          console.log('PREFLIGHT_PASSED');
          NODE
