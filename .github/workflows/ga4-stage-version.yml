name: Stage RelayWA GA4 Worker Version (no deployment)

on:
  push:
    branches: [feat/ga4-cloudflare-credentials]
    paths:
      - .github/workflows/ga4-stage-version.yml
      - scripts/ga4/stage-worker-version.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: relaywa-platform-ga4-production
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify website reports and Worker patch behavior
        run: |
          node --check cloudflare/ga4-reporting.mjs
          node --test cloudflare/ga4-reporting.test.mjs
          python3 -m py_compile scripts/ga4/stage-worker-version.py
      - name: Stage new Worker version with encrypted secret, preserving production (no deployment)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
        run: python3 scripts/ga4/stage-worker-version.py
      - name: Save production backup and staged version reference to private GitHub Actions artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: relaywa-platform-ga4-backup-and-stage
          path: |
            ${{ runner.temp }}/relaywa-ga4-platform-before.multipart
            ${{ runner.temp }}/relaywa-ga4-stage-manifest.json
          retention-days: 3
          if-no-files-found: error
      - name: Erase temporary Worker copy from runner
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/relaywa-ga4-platform-before.mjs" "$RUNNER_TEMP/relaywa-ga4-platform-candidate.mjs" "$RUNNER_TEMP/relaywa-ga4-platform-before.multipart"
