name: RelayWA deployment read-only verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect deployed Cloudflare Worker metadata
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          if(!process.env.CF_TOKEN || !process.env.CF_ACCOUNT) throw Error('Cloudflare inspection secrets missing');
          const base=`https://api.cloudflare.com/client/v4/accounts/${process.env.CF_ACCOUNT}`;
          async function get(path){
            const r=await fetch(base+path,{headers:{Authorization:`Bearer ${process.env.CF_TOKEN}`}});
            const j=await r.json();if(!r.ok||!j.success)throw Error(`Cloudflare read failed: ${r.status}`);
            return j.result;
          }
          const deployments=await get('/workers/scripts/relaywa-api/deployments');
          const settings=await get('/workers/scripts/relaywa-api/settings');
          const databases=await get('/d1/database?per_page=100');
          const d1=databases.find(x=>x.name==='relaywa');
          const bindings=(settings.bindings||[]).filter(x=>x.type==='d1').map(x=>({name:x.name,database_id:x.id??x.database_id}));
          const recent=Array.isArray(deployments)?deployments:(deployments.deployments||[]);
          console.log('DEPLOYMENTS',JSON.stringify(recent.slice(0,5).map(x=>({id:x.id,created_on:x.created_on,versions:x.versions}))));
          console.log('D1_BINDING_MATCH',Boolean(d1&&bindings.some(x=>x.database_id===d1.uuid)));
          if(!d1||!bindings.some(x=>x.database_id===d1.uuid))throw Error('D1 binding mismatch');
          if(!recent.length)throw Error('No deployment metadata returned');
          NODE
